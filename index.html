<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icon-192.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f9fc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="VerboVivo" />
    <meta name="description" content="VerboVivo — Estudio Bíblico, Exégesis y Homilética Offline con 0% Alteración Textual" />
    <title>VerboVivo — Estudio Bíblico, Exégesis y Homilética Offline</title>
  </head>
  <body class="bg-nocturne-950 text-zinc-200 antialiased selection:bg-sacred-gold/25 selection:text-zinc-900">
    <div id="root"></div>
    <script>
      // Desactivar service workers antiguos en desarrollo y purgar caches
      if ('serviceWorker' in navigator) {
        if (location.hostname === 'localhost' || location.hostname === '127.0.0.1') {
          navigator.serviceWorker.getRegistrations().then(function(regs) {
            for (var r of regs) r.unregister();
          });
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var n of names) caches.delete(n);
            });
          }
        } else {
          window.addEventListener('load', () => {
            navigator.serviceWorker.register('/sw.js').catch((err) => {
              console.warn('[PWA] Service Worker registration failed:', err);
            });
          });
        }
      }
      try {
        localStorage.removeItem('verbovivo_theme');
        localStorage.removeItem('theme');
      } catch (e) {}
      document.documentElement.classList.remove('dark');
    </script>
    <script src="/sql-wasm.js"></script>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
